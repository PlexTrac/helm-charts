name: chart-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write   # allows gitleaks to upload SARIF results

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits

      - name: Install Gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan current working tree
        run: gitleaks detect --source . --config .gitleaks.toml --verbose

      - name: Scan full git history
        # Scans every commit reachable from HEAD — catches secrets that were
        # committed and later removed/overwritten.
        run: gitleaks detect --config .gitleaks.toml --verbose

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Validate chart version is SemVer
        run: |
          VERSION=$(awk '/^version:/{print $2; exit}' charts/plextrac/Chart.yaml)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Chart version is not SemVer: $VERSION"
            exit 1
          fi

      - name: Helm lint
        run: helm lint charts/plextrac

      - name: Helm template smoke test
        run: helm template plextrac charts/plextrac > /tmp/plextrac-render.yaml

      - name: Secret-key reference is in sync with the chart
        # docs/pre-install-checklist.md section C.1 is generated from the chart.
        # This fails the build if requiredKeys changed without regenerating the doc.
        run: scripts/gen-secrets-reference.py --check

      - name: Quick secret pattern sanity check
        # Lightweight fallback — gitleaks (in the secrets-scan job) is the
        # authoritative scanner.  This catches obvious plaintext values that
        # don't require the full gitleaks rule set.
        run: .github/scripts/scan-secrets.sh
