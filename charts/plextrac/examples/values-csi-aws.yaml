# Self-hosted PlexTrac using CSI Secrets Store with AWS Secrets Manager
# Requires: secrets-store-csi-driver + aws-secrets-manager-provider installed.
# Configure secretObjects to map AWS secret keys to the Kubernetes secret format
# expected by PlexTrac (application-secrets, shared-secrets).

global:
  namespace: plextrac
  createNamespace: true
  imagePullSecrets: []
  ingress:
    host: plextrac.mycompany.com
    tlsSecretName: internal-tls
    certManager:
      issuer: ""     # "letsencrypt" | "letsencrypt-staging" | "selfSigned" | "" (none / bring-your-own)
      email: ""      # required for letsencrypt / letsencrypt-staging
    certManagerClusterIssuer: ""   # used only when certManager.issuer is ""

storage:
  # EKS block storage. Requires the aws-ebs-csi-driver add-on.
  storageClassName: gp3
  accessMode: ReadWriteOnce

  # Per-claim overrides. plextracapi and whitelabeling are the only claims mounted by
  # more than one pod, so on a MULTI-NODE cluster they need ReadWriteMany on a shared
  # filesystem. The database claims must stay on block storage. Single-node clusters
  # need nothing here.
  #
  # Rather than hand-editing this, add the matching overlay as a second -f:
  #   -f examples/values-eks-efs.yaml
  # claims:
  #   plextracapi:
  #     accessMode: ReadWriteMany
  #     storageClassName: efs-plextrac
  #   whitelabeling:
  #     accessMode: ReadWriteMany
  #     storageClassName: efs-plextrac

# Required on cloud block storage. The app image runs as uid/gid 1337, and a freshly
# provisioned EBS volume arrives owned by root, so the four workloads that mount the
# shared claims (plextracapi, event-orchestrator, integration-worker, migrations-and-etl)
# could not write to it. Harmless to leave set on any backend. Verify after install:
#   kubectl -n plextrac exec deploy/plextracapi -- touch /usr/src/plextrac-api/uploads/.probe
podSecurityContext:
  fsGroup: 1337
  fsGroupChangePolicy: OnRootMismatch

secrets:
  mode: csi
  csi:
    secretProviderClass:
      enabled: true
      name: plextrac-secrets-provider
      provider: aws
      parameters:
        objects: |
          - objectName: "plextrac/application-secrets"
            objectType: "secretsmanager"
          - objectName: "plextrac/shared-secrets"
            objectType: "secretsmanager"
      secretObjects:
        - secretName: application-secrets
          type: Opaque
          data:
            - objectName: "plextrac/application-secrets"
              key: application-secrets
        - secretName: shared-secrets
          type: Opaque
          data:
            - objectName: "plextrac/shared-secrets"
              key: shared-secrets

images:
  backend:
    repository: plextrac/plextracapi
    tag: stable
  nginx:
    repository: plextrac/plextracnginx
    tag: stable
  ckeditor:
    registry: docker.cke-cs.com
    repository: cs
    tag: latest
  plextracdb:
    repository: plextrac/plextracdb
    tag: 7.2.0
  postgres:
    repository: plextrac/plextracpostgres
    tag: stable
  redis:
    repository: redis
    tag: 8.4.0-alpine
  redisExporter:
    repository: oliver006/redis_exporter
    tag: latest
  minio:
    repository: plextrac/minio
    tag: latest
  minioBootstrap:
    repository: plextrac/plextrac-minio-bootstrap
    tag: stable
  synqly:
    # On quay.io by default — set registry to your quay proxy/mirror to override.
    registry: quay.io
    repository: synqly/embedded
    tag: embedded-2026.06.19
  keycloak:
    repository: plextrac/plextrac-keycloak
    tag: stable
  # keycloakSetup:                            # optional; defaults to the backend image (contains the CLI). Set for a lean build.
  #   repository: plextrac/plextracapi-keycloak-setup
  #   tag: stable
  mcp:
    repository: plextrac/mcp
    tag: stable

replicaCounts:
  plextracapi: 3
  ckeditor: 3
  eventOrchestrator: 1
  notificationEngine: 1
  notificationSender: 1
  integrationWorker: 1
  contextualScoringService: 1
  datalakeMaintainer: 0

# Optional in-cluster Synqly integration service (disabled by default).
# Runs internal-only; PlexTrac is wired to it automatically. See docs/user-guide.md.
# synqly:
#   enabled: true
#   database:
#     dedicated: false   # reuse bundled Postgres; true = chart deploys a dedicated one

# Optional in-cluster Keycloak OIDC/SSO broker (disabled by default). Browser-facing: needs its own
# hostname + TLS, and a custom backend image with the on-prem realm migration. See docs/user-guide.md.
# keycloak:
#   enabled: true
#   host: auth.mycompany.com          # REQUIRED — browser-facing auth hostname
#   certManager:
#     issuer: letsencrypt             # selfSigned | letsencrypt | letsencrypt-staging | "" (BYO / pre-created)
#     email: admin@mycompany.com
#   database:
#     dedicated: false                # reuse bundled Postgres; true = chart deploys a dedicated one

# Optional in-cluster MCP (Model Context Protocol) server (disabled by default).
# REQUIRES keycloak.enabled. Served at /mcp on the app host. See docs/user-guide.md.
# mcp:
#   enabled: true
#   otel:
#     enabled: false          # set true + exporterEndpoint for your OTLP collector

# Extra non-secret env vars injected into the env-config ConfigMap (see the chart's values.yaml).
# extraEnv:
#   SOME_FEATURE_FLAG: "true"
#   CUSTOM_TIMEOUT_MS: "30000"
