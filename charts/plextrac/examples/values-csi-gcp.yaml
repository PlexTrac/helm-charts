# Self-hosted PlexTrac using CSI Secrets Store with GCP Secret Manager
# Requires: secrets-store-csi-driver + secrets-store-csi-driver-provider-gcp installed.
# Configure secretObjects to map GCP secret keys to the Kubernetes secret format
# expected by PlexTrac (application-secrets, shared-secrets).

global:
  namespace: plextrac
  createNamespace: true
  imagePullSecrets: []
  ingress:
    host: plextrac.mycompany.com
    tlsSecretName: plextrac-com-tls
    certManagerClusterIssuer: ""

secrets:
  mode: csi
  csi:
    secretProviderClass:
      enabled: true
      name: plextrac-secrets-provider
      provider: gcp
      parameters:
        secrets: |
          - resourceName: "projects/my-gcp-project/secrets/plextrac-application-secrets/versions/latest"
            fileName: "application-secrets"
          - resourceName: "projects/my-gcp-project/secrets/plextrac-shared-secrets/versions/latest"
            fileName: "shared-secrets"
      secretObjects:
        - secretName: application-secrets
          type: Opaque
          data:
            - objectName: application-secrets
              key: application-secrets
        - secretName: shared-secrets
          type: Opaque
          data:
            - objectName: shared-secrets
              key: shared-secrets

images:
  backend:
    repository: plextrac/plextracapi
    tag: stable
  nginx:
    repository: plextrac/plextracnginx
    tag: stable
  ckeditor:
    registry: docker.cke-cs.com
    repository: cs
    tag: latest
  plextracdb:
    repository: plextrac/plextracdb
    tag: 6.5.1
  postgres:
    repository: plextrac/plextracpostgres
    tag: stable
  redis:
    repository: redis
    tag: 8.4.0-alpine
  redisExporter:
    repository: oliver006/redis_exporter
    tag: latest
  minio:
    repository: plextrac/minio
    tag: latest
  minioBootstrap:
    repository: plextrac/plextrac-minio-bootstrap
    tag: stable

replicaCounts:
  plextracapi: 3
  ckeditor: 3
  eventOrchestrator: 1
  notificationEngine: 1
  notificationSender: 1
  integrationWorker: 1
  contextualScoringService: 1
  datalakeMaintainer: 0
