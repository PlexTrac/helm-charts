# Self-hosted PlexTrac using External Secrets Operator (ESO)
# Requires: External Secrets Operator installed, a ClusterSecretStore configured.
# Secrets are pulled from your external secret store on the configured refresh interval.

global:
  namespace: plextrac
  createNamespace: true
  imagePullSecrets: []
  ingress:
    host: plextrac.mycompany.com
    tlsSecretName: plextrac-com-tls
    certManager:
      issuer: ""     # "letsencrypt" | "letsencrypt-staging" | "selfSigned" | "" (none / bring-your-own)
      email: ""      # required for letsencrypt / letsencrypt-staging
    certManagerClusterIssuer: ""   # used only when certManager.issuer is ""

secrets:
  mode: externalSecrets
  externalSecrets:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: my-secret-store   # Name of your ClusterSecretStore
    application:
      targetSecretName: application-secrets
      remoteKey: plextrac/application-secrets   # Path/name of the secret in your store
    shared:
      targetSecretName: shared-secrets
      remoteKey: plextrac/shared-secrets
    registryCredentials:
      enabled: false   # Enable if CKEditor image is pulled from a private registry
      targetSecretName: regcred-dorf
      remoteKey: plextrac/registry-credentials
    tls:
      enabled: false   # Enable if managing TLS cert via external secrets
      targetSecretName: plextrac-com-tls
      remoteKey: plextrac/tls-cert

images:
  backend:
    repository: plextrac/plextracapi
    tag: stable
  nginx:
    repository: plextrac/plextracnginx
    tag: stable
  ckeditor:
    registry: docker.cke-cs.com
    repository: cs
    tag: latest
  plextracdb:
    repository: plextrac/plextracdb
    tag: 6.5.1
  postgres:
    repository: plextrac/plextracpostgres
    tag: stable
  redis:
    repository: redis
    tag: 8.4.0-alpine
  redisExporter:
    repository: oliver006/redis_exporter
    tag: latest
  minio:
    repository: plextrac/minio
    tag: latest
  minioBootstrap:
    repository: plextrac/plextrac-minio-bootstrap
    tag: stable
  synqly:
    # On quay.io by default — set registry to your quay proxy/mirror to override.
    registry: quay.io
    repository: synqly/embedded
    tag: embedded-2026.06.19

replicaCounts:
  plextracapi: 3
  ckeditor: 3
  eventOrchestrator: 1
  notificationEngine: 1
  notificationSender: 1
  integrationWorker: 1
  contextualScoringService: 1
  datalakeMaintainer: 0

# Optional in-cluster Synqly integration service (disabled by default).
# Runs internal-only; PlexTrac is wired to it automatically. See docs/user-guide.md.
# synqly:
#   enabled: true
#   database:
#     dedicated: false   # reuse bundled Postgres; true = chart deploys a dedicated one
