global:
  namespace: plextrac
  createNamespace: true
  ingress:
    proxyBodySize: 100m   # max upload size on every Ingress; "0" = no limit, "" = controller default (1m)

secrets:
  mode: externalSecrets
  externalSecrets:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: gcp-cluster-secret-store
    application:
      targetSecretName: application-secrets
      remoteKey: placeholder_gcp_secret_name
    shared:
      targetSecretName: shared-secrets
      remoteKey: plextrac-shared-secrets
      commonProperty: allstages
      stageProperty: ga
    registryCredentials:
      enabled: true
      targetSecretName: regcred-dorf
      remoteKey: regcred-dorf
    tls:
      enabled: true
      targetSecretName: internal-tls
      remoteKey: internal-tls

images:
  backend:
    repository: plextrac/plextracapi
    tag: 2.27.4
  nginx:
    repository: plextrac/plextracnginx
    tag: 2.27.4
  ckeditor:
    registry: docker.cke-cs.com
    repository: cs
    tag: 4.25.0
  postgres:
    repository: plextrac/plextracpostgres
    tag: stable
  redis:
    repository: redis
    tag: 8.4.0-alpine
  redisExporter:
    repository: oliver006/redis_exporter
    tag: latest
  minioBootstrap:
    repository: plextrac/plextrac-minio-bootstrap
    tag: stable
  minio:
    repository: plextrac/minio
    tag: latest

# Extra non-secret env vars injected into the env-config ConfigMap (see the chart's values.yaml).
# extraEnv:
#   SOME_FEATURE_FLAG: "true"
#   CUSTOM_TIMEOUT_MS: "30000"
