global:
  namespace: plextrac
  createNamespace: false
  # Run scripts/setup-registry-credentials.sh before installing. It creates the
  # image pull secrets in the cluster; reference them here by name.
  imagePullSecrets:
    - name: plextrac-registry-creds
    # - name: ckeditor-registry-creds   # uncomment if CKEditor credentials were provided
  ingress:
    host: plextrac.example.com
    tlsSecretName: plextrac-com-tls
    certManager:
      issuer: ""     # "letsencrypt" | "letsencrypt-staging" | "selfSigned" | "" (none / bring-your-own)
      email: ""      # required for letsencrypt / letsencrypt-staging
    certManagerClusterIssuer: ""   # used only when certManager.issuer is ""

secrets:
  mode: manual
  manual:
    createKubernetesSecrets: true
    generatedSecrets:
      application:
        name: application-secrets
        stringData:
          # Optional override. Can be blank.
          ADMIN_EMAIL: ""
      shared:
        name: shared-secrets
        stringData:
          # Required for CKEditor. Enter your license key.
          CKEDITOR_SERVER_LICENSE_KEY: ""
      # registryCredentials: not managed here — created by setup-registry-credentials.sh
      tls:
        enabled: false
        name: plextrac-com-tls
        crt: ""
        key: ""
      additional:
        - name: event-orchestrator-secrets
          type: Opaque
          stringData:
            EVENT_ORCHESTRATOR_API_KEY: ""

# Optional in-cluster Synqly integration service (disabled by default).
# Runs internal-only; PlexTrac is wired to it automatically. See docs/user-guide.md.
# synqly:
#   enabled: true
#   database:
#     dedicated: false   # reuse bundled Postgres; true = chart deploys a dedicated one
