global:
  namespace: plextrac
  createNamespace: false
  ingress:
    host: plextrac.example.com
    tlsSecretName: plextrac-com-tls
    certManagerClusterIssuer: ""

secrets:
  mode: manual
  manual:
    createKubernetesSecrets: true
    generatedSecrets:
      application:
        name: application-secrets
        stringData:
          ADMIN_EMAIL: ""
          API_INTEGRATION_AUTH_CONFIG_NOTIFICATION_SERVICE: replace-me
          CB_ADMIN_PASS: replace-me
          CB_ADMIN_USER: replace-me
          CB_API_PASS: replace-me
          CB_API_USER: replace-me
          CKEDITOR_ENVIRONMENT_SECRET_KEY: replace-me
          CLOUD_STORAGE_ACCESS_KEY: replace-me
          CLOUD_STORAGE_SECRET_KEY: replace-me
          COOKIE_KEY: replace-me
          INTERNAL_API_KEY_SHARED: replace-me
          JWT_KEY: replace-me
          MFA_KEY: replace-me
          MINIO_LOCAL_PASSWORD: replace-me
          MINIO_LOCAL_USER: replace-me
          MINIO_ROOT_PASSWORD: replace-me
          MINIO_ROOT_USER: replace-me
          PG_CKEDITOR_ADMIN_PASSWORD: replace-me
          PG_CKEDITOR_ADMIN_USER: replace-me
          PG_CKEDITOR_DB: replace-me
          PG_CKEDITOR_RO_PASSWORD: replace-me
          PG_CKEDITOR_RO_USER: replace-me
          PG_CKEDITOR_RW_PASSWORD: replace-me
          PG_CKEDITOR_RW_USER: replace-me
          PG_CORE_ADMIN_PASSWORD: replace-me
          PG_CORE_ADMIN_USER: replace-me
          PG_CORE_AI_SQL_PASSWORD: replace-me
          PG_CORE_AI_SQL_USER: replace-me
          PG_CORE_DB: replace-me
          PG_CORE_RO_PASSWORD: replace-me
          PG_CORE_RO_USER: replace-me
          PG_CORE_RW_PASSWORD: replace-me
          PG_CORE_RW_USER: replace-me
          PG_METRICS_PASSWORD: replace-me
          PG_METRICS_USER: replace-me
          PG_RUNBOOKS_ADMIN_PASSWORD: replace-me
          PG_RUNBOOKS_ADMIN_USER: replace-me
          PG_RUNBOOKS_DB: replace-me
          PG_RUNBOOKS_RO_PASSWORD: replace-me
          PG_RUNBOOKS_RO_USER: replace-me
          PG_RUNBOOKS_RW_PASSWORD: replace-me
          PG_RUNBOOKS_RW_USER: replace-me
          POSTGRES_PASSWORD: replace-me
          POSTGRES_USER: replace-me
          PROVIDER_CODE_KEY: replace-me
          REDIS_PASSWORD: replace-me
      shared:
        name: shared-secrets
        stringData:
          CKEDITOR_SERVER_LICENSE_KEY: replace-me
          LAUNCH_DARKLY_SDK_KEY: replace-me
          PENDO_API_KEY: replace-me
          PLEXAI_ASKAI_GEMINI_API_KEY: replace-me
          SENTRY_DSN_BACKEND: replace-me
          pt-load-bq-sa-svc-acct-creds.json: |
            {}
      registryCredentials:
        enabled: true
        name: regcred-dorf
        dockerconfigjson: '{"auths":{"registry.example.com":{"username":"replace-me","password":"replace-me","auth":"replace-me"}}}'
      tls:
        enabled: false
        name: plextrac-com-tls
        crt: ""
        key: ""
      additional:
        - name: event-orchestrator-secrets
          type: Opaque
          stringData:
            EVENT_ORCHESTRATOR_API_KEY: replace-me
