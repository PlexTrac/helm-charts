global:
  namespace: plextrac
  createNamespace: false
  ingress:
    host: plextrac.example.com
    tlsSecretName: plextrac-com-tls
    certManagerClusterIssuer: ""

secrets:
  mode: manual
  manual:
    createKubernetesSecrets: true
    generatedSecrets:
      application:
        name: application-secrets
        stringData:
          # Optional override. Can be blank.
          ADMIN_EMAIL: ""
      shared:
        name: shared-secrets
        stringData:
          # Required for CKEditor. Enter your license key.
          CKEDITOR_SERVER_LICENSE_KEY: ""
      registryCredentials:
        enabled: true
        name: regcred-dorf
        # Set to a real docker config JSON if your cluster cannot pull privately by default.
        dockerconfigjson: "{}"
      tls:
        enabled: false
        name: plextrac-com-tls
        crt: ""
        key: ""
      additional:
        - name: event-orchestrator-secrets
          type: Opaque
          stringData:
            EVENT_ORCHESTRATOR_API_KEY: ""
