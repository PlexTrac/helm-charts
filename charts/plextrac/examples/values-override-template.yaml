# Copy this file and uncomment only what you need for your environment.
# Example:
#   cp charts/plextrac/examples/values-override-template.yaml my-values.yaml
#   helm upgrade --install plextrac ./charts/plextrac -f my-values.yaml --namespace plextrac --create-namespace

# global:
#   namespace: plextrac
#   # Set false when namespace already exists.
#   createNamespace: false
#   # Optional registry override — applied to all images except ckeditor (which keeps its own).
#   image:
#     registry: ""   # e.g. registry.mycompany.com
#   ingress:
#     # Required for valid Ingress objects.
#     host: example.plextrac.com
#     # TLS secret used by plextracnginx ingress.
#     tlsSecretName: internal-tls
#     # cert-manager TLS. issuer: letsencrypt | letsencrypt-staging | selfSigned | "" (none / BYO)
#     certManager:
#       issuer: ""
#       email: ""                    # required for letsencrypt / letsencrypt-staging
#     # Used only when certManager.issuer is "" — bring your own issuer:
#     certManagerClusterIssuer: ""

# secrets:
#   # Choose one: externalSecrets | csi | manual
#   mode: externalSecrets
#
#   # External Secrets Operator mode (default GA path)
#   externalSecrets:
#     refreshInterval: 1h
#     secretStoreRef:
#       kind: ClusterSecretStore
#       name: gcp-cluster-secret-store
#     application:
#       targetSecretName: application-secrets
#       remoteKey: your-application-secret-key
#     shared:
#       targetSecretName: shared-secrets
#       remoteKey: your-shared-secret-key
#       commonProperty: allstages
#       stageProperty: ga
#     registryCredentials:
#       enabled: true
#       targetSecretName: internal-registry-creds
#       remoteKey: internal-registry-creds
#     tls:
#       enabled: true
#       targetSecretName: internal-tls
#       remoteKey: internal-tls
#
#   # Secrets Store CSI Driver mode
#   csi:
#     secretProviderClass:
#       enabled: true
#       name: plextrac-secrets-provider
#       provider: gcp
#       parameters: {}
#       secretObjects: []
#
#   # Manual mode
#   manual:
#     # Set true to have this chart create required Kubernetes Secrets.
#     createKubernetesSecrets: true
#     # Missing required GA keys are auto-generated by default.
#     generatedSecrets:
#       application:
#         name: application-secrets
#         stringData:
#           # Optional: admin notification email.
#           ADMIN_EMAIL: ""
#         data: {}
#       shared:
#         name: shared-secrets
#         stringData:
#           # Required when CKEditor services are enabled.
#           CKEDITOR_SERVER_LICENSE_KEY: ""
#         data: {}
#       registryCredentials:
#         enabled: true
#         name: internal-registry-creds
#         dockerconfigjson: ""
#       tls:
#         enabled: false
#         name: internal-tls
#         crt: ""
#         key: ""
#       # Optional per-deployment additional secret objects.
#       additional: []
#
#     # Optional override if your deployment key contract differs from GA defaults.
#     requiredKeys:
#       application: []
#       shared: []

# Optional per-component image overrides (tag pinning, custom repo, or per-component registry).
# Use global.image.registry above to re-home every image at once; override here only where needed.
# images:
#   backend:
#     tag: "2.28.0"                      # pin a specific version
#   ckeditor:
#     registry: registry.mycompany.com   # mirror CKEditor (overrides its pinned default registry)
#     repository: cke-cs/cs
#     tag: latest
#   synqly:
#     registry: registry.mycompany.com   # your quay proxy/mirror (Synqly's image is on quay.io)
#     repository: synqly/embedded
#     tag: embedded-2026.06.19

# Optional in-cluster Synqly integration service (disabled by default).
# Runs internal-only; PlexTrac is wired to it automatically. See docs/user-guide.md.
# synqly:
#   enabled: true
#   database:
#     dedicated: false   # reuse bundled Postgres; true = chart deploys a dedicated one
