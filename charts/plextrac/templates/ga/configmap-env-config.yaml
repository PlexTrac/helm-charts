apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
  namespace: {{ include "plextrac.namespace" . }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
data:
  NODE_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: logfmt
  MAILER_SECURE: "true"
  SYSTEM_LEVEL: PRODUCTION
  DATALAKE_ETL: "false"
  PLATFORM_HOSTING_TYPE: on-premise

  # Ingress / domain
  CLIENT_DOMAIN_NAME: {{ .Values.global.ingress.host | default "" | quote }}

  # Internal service URLs
  CORE_API_BASE_URL: http://plextracapi:4350
  CTEM_API_BASE_URL: http://ctem-api:3332
  COUCHBASE_URL: http://plextracdb
  REDIS_CONNECTION_STRING: redis://redis:6379
  PG_HOST: postgres

  # Couchbase
  CB_BUCKET: reportMe

  # MinIO / object storage
  MINIO_ENABLED: "true"
  CLOUD_STORAGE_ENDPOINT: minio
  CLOUD_STORAGE_PORT: "9000"
  CLOUD_STORAGE_SSL: "false"
  UPSTREAM_CLOUD_BUCKET: cloud
  UPSTREAM_CLOUD_HOST: minio
  UPSTREAM_CLOUD_PREFIX: uploads

  # CKEditor
  CKEDITOR_LOG_LEVEL: "30"
  CKEDITOR_ENABLE_METRIC_LOGS: "true"
  CKEDITOR_MIGRATE: "true"

  # Notifications
  NOTIFICATION_DRY_RUN: "false"
  ENABLE_REQUEST_METRICS: "true"
{{- if .Values.synqly.enabled }}

  # Synqly (in-cluster)
  SYNQLY_EMBEDDED_URL: http://synqly-embedded:8000
{{- end }}
{{- if .Values.keycloak.enabled }}

  # Keycloak (in-cluster OIDC broker)
  KEYCLOAK_INTERNAL_BASE_URL: http://keycloak-internal:80
  KEYCLOAK_EXTERNAL_BASE_URL: {{ printf "https://%s" .Values.keycloak.host | quote }}
  KEYCLOAK_OIDC_BROKER_PLEXTRACAPI_INTERNAL_BASE_URL: http://plextracapi:4350
  KEYCLOAK_TENANT_REALM_ADMIN_CLIENT_ID: plextrac-tenant-realm-admin-service-account
{{- end }}
{{- if .Values.mcp.enabled }}

  # MCP (in-cluster Model Context Protocol server)
  MCP_SERVER_API_INTERNAL_URL: http://plextracapi:4350
  MCP_SERVER_OTEL_EXPORTER_ENDPOINT: {{ .Values.mcp.otel.exporterEndpoint | default "" | quote }}
{{- end }}
{{- with .Values.extraEnv }}

  # Extra env vars (user-provided via .Values.extraEnv)
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
