apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
  namespace: {{ include "plextrac.namespace" . }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
data:
  NODE_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: logfmt
  MAILER_SECURE: "true"
  SYSTEM_LEVEL: PRODUCTION
  DATALAKE_ETL: "false"

  # Ingress / domain
  CLIENT_DOMAIN_NAME: {{ .Values.global.ingress.host | default "" | quote }}

  # Internal service URLs
  CORE_API_BASE_URL: http://plextracapi:4350
  COUCHBASE_URL: http://plextracdb
  REDIS_CONNECTION_STRING: redis://redis:6379
  PG_HOST: postgres

  # MinIO / object storage
  MINIO_ENABLED: "true"
  CLOUD_STORAGE_ENDPOINT: minio
  CLOUD_STORAGE_PORT: "9000"
  CLOUD_STORAGE_SSL: "false"
  UPSTREAM_CLOUD_BUCKET: cloud
  UPSTREAM_CLOUD_HOST: minio
  UPSTREAM_CLOUD_PREFIX: uploads

  # CKEditor
  CKEDITOR_LOG_LEVEL: "30"
  CKEDITOR_ENABLE_METRIC_LOGS: "true"
  CKEDITOR_MIGRATE: "true"

  # Notifications
  NOTIFICATION_DRY_RUN: "false"
  ENABLE_REQUEST_METRICS: "true"
