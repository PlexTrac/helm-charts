{{- if and .Values.keycloak.enabled .Values.keycloak.database.dedicated }}
{{- $ns := include "plextrac.namespace" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres-pvc
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
spec:
  {{- include "plextrac.pvcSpec" (dict "claim" "keycloakPostgres" "size" (.Values.keycloak.database.storage | default "8Gi") "root" $) | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: keycloak-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-postgres
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak-postgres
  template:
    metadata:
      labels:
        app: keycloak-postgres
        {{- include "plextrac.commonLabels" . | nindent 8 }}
    spec:
      {{- include "plextrac.keycloak.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: postgres
        image: {{ include "plextrac.image" (dict "image" .Values.images.postgres "root" $) }}
        imagePullPolicy: Always
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: {{ .Values.keycloak.database.name | default "keycloak" | quote }}
        - name: POSTGRES_USER
          valueFrom: { secretKeyRef: { name: keycloak-db-secret, key: username } }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: keycloak-db-secret, key: password } }
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: keycloak-postgres-pvc
{{- end }}
