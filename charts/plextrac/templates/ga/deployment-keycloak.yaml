{{- if .Values.keycloak.enabled }}
{{- $port := .Values.keycloak.database.port | default 5432 -}}
{{- $host := .Values.keycloak.database.host | default (ternary "keycloak-postgres" "postgres" .Values.keycloak.database.dedicated) -}}
{{- $db := .Values.keycloak.database.name | default "keycloak" -}}
{{- $user := .Values.keycloak.database.user | default "keycloak_admin" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ include "plextrac.namespace" . }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.keycloak.replicas | default 1 }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        {{- include "plextrac.commonLabels" . | nindent 8 }}
    spec:
      {{- include "plextrac.keycloak.imagePullSecrets" . | nindent 6 }}
      {{- if not .Values.keycloak.database.dedicated }}
      initContainers:
      # Create the keycloak database + role in the bundled Postgres (idempotent). Connects as
      # the bundled superuser; sets the keycloak role's password from keycloak-db-secret.
      - name: create-db
        image: {{ include "plextrac.image" (dict "image" .Values.images.postgres "root" $) }}
        command: ["sh", "-c"]
        args:
        - |
          until pg_isready -h {{ $host }} -p {{ $port }}; do echo "waiting for postgres"; sleep 3; done
          psql -h {{ $host }} -p {{ $port }} -tc "SELECT 1 FROM pg_database WHERE datname='{{ $db }}'" | grep -q 1 \
            || psql -h {{ $host }} -p {{ $port }} -c "CREATE DATABASE {{ $db }}"
          psql -h {{ $host }} -p {{ $port }} -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ $user }}'" | grep -q 1 \
            || psql -h {{ $host }} -p {{ $port }} -c "CREATE ROLE {{ $user }} LOGIN PASSWORD '$KC_PASS'"
          psql -h {{ $host }} -p {{ $port }} -d {{ $db }} \
            -c "GRANT CONNECT ON DATABASE {{ $db }} TO {{ $user }}; GRANT USAGE ON SCHEMA public TO {{ $user }}; GRANT CREATE ON SCHEMA public TO {{ $user }};"
        env:
        - name: PGUSER
          valueFrom: { secretKeyRef: { name: application-secrets, key: POSTGRES_USER } }
        - name: PGPASSWORD
          valueFrom: { secretKeyRef: { name: application-secrets, key: POSTGRES_PASSWORD } }
        - name: KC_PASS
          valueFrom: { secretKeyRef: { name: keycloak-db-secret, key: password } }
      {{- end }}
      containers:
      - name: keycloak
        image: {{ include "plextrac.image" (dict "image" .Values.images.keycloak "root" $) }}
        imagePullPolicy: Always
        args: ["start"]
        ports:
        - containerPort: 8080
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: "jdbc:postgresql://{{ $host }}:{{ $port }}/{{ $db }}?sslmode=disable"
        - name: KC_DB_USERNAME
          valueFrom: { secretKeyRef: { name: keycloak-db-secret, key: username } }
        - name: KC_DB_PASSWORD
          valueFrom: { secretKeyRef: { name: keycloak-db-secret, key: password } }
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom: { secretKeyRef: { name: keycloak-admin-secret, key: username } }
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: keycloak-admin-secret, key: password } }
        # Browser-facing hostname (TLS terminates at the ingress; keycloak speaks HTTP behind it).
        - name: KC_HOSTNAME
          value: "https://{{ .Values.keycloak.host }}"
        - name: KC_HOSTNAME_ADMIN
          value: "https://{{ .Values.keycloak.host }}"
        - name: KC_HOSTNAME_STRICT
          value: "true"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_HTTP_MANAGEMENT_HEALTH_ENABLED
          value: "false"
        startupProbe:
          httpGet: { path: /health/started, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 45
        livenessProbe:
          httpGet: { path: /health/live, port: 8080 }
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet: { path: /health/ready, port: 8080 }
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          {{- toYaml .Values.keycloak.resources | nindent 10 }}
{{- end }}
