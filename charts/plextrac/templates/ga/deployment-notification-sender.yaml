apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: notifications
    app.kubernetes.io/instance: notification-sender
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: notification-sender
    app.kubernetes.io/part-of: plextrac
    name: notification-sender
  name: notification-sender
  namespace: {{ include "plextrac.namespace" . }}
spec:
  replicas: {{ .Values.replicaCounts.notificationSender }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: notification-sender
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
        prometheus.io/scrape: "true"
      labels:
        app: notification-sender
        app.kubernetes.io/component: notifications
        app.kubernetes.io/instance: notification-sender
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: notification-sender
        app.kubernetes.io/part-of: plextrac
    spec:
      {{- include "plextrac.imagePullSecrets" . | nindent 6 }}
      containers:
      - args:
        - run
        - start:notification-sender
        command:
        - npm
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: application-secrets
        - name: CB_API_USER
          valueFrom:
            secretKeyRef:
              key: CB_API_USER
              name: application-secrets
        - name: CB_API_PASS
          valueFrom:
            secretKeyRef:
              key: CB_API_PASS
              name: application-secrets
        - name: API_INTEGRATION_AUTH_CONFIG_NOTIFICATION_SERVICE
          valueFrom:
            secretKeyRef:
              key: API_INTEGRATION_AUTH_CONFIG_NOTIFICATION_SERVICE
              name: application-secrets
        - name: CORE_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: CORE_API_BASE_URL
              name: env-config
        - name: INTERNAL_API_KEY_SHARED
          valueFrom:
            secretKeyRef:
              key: INTERNAL_API_KEY_SHARED
              name: application-secrets
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/plextrac/custom-ca/ca.pem
        envFrom:
        - configMapRef:
            name: env-config
        image: {{ include "plextrac.image" (dict "image" .Values.images.backend "root" $) }}
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - npm
            - run
            - healthcheck:notification-sender
            - readiness
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 20
          timeoutSeconds: 10
        name: notification-sender
        resources:
          {{- toYaml .Values.resources.notificationSender | nindent 10 }}
        volumeMounts:
        - mountPath: /etc/plextrac/custom-ca
          name: custom-ca
          readOnly: true
      restartPolicy: Always
      volumes:
      # User-supplied private CA bundle (see customCA in values.yaml). Must stay
      # optional: a missing Secret cannot be allowed to block pod start.
      - name: custom-ca
        secret:
          optional: true
          secretName: {{ .Values.customCA.secretName | default "plextrac-custom-ca" }}
