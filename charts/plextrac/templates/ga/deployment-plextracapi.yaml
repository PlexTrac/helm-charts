apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: plextracapi
    app.kubernetes.io/component: core-backend
    app.kubernetes.io/instance: plextracapi
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: plextracapi
    app.kubernetes.io/part-of: plextrac
    name: plextracapi
    serviceName: core-backend
  name: plextracapi
  namespace: {{ include "plextrac.namespace" . }}
spec:
  replicas: {{ .Values.replicaCounts.plextracapi }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: plextracapi
  strategy:
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
        prometheus.io/scrape: "true"
      labels:
        app: plextracapi
        app.kubernetes.io/component: core-backend
        app.kubernetes.io/instance: plextracapi
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: plextracapi
        app.kubernetes.io/part-of: plextrac
        name: plextracapi
        podMonitor: enable
        serviceMonitor: enable
        serviceName: core-backend
    spec:
      {{- include "plextrac.imagePullSecrets" . | nindent 6 }}
      containers:
      - args:
        - ./dist/apps/plextracapi/src/index.js
        command:
        - node
        env:
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              key: ADMIN_EMAIL
              name: application-secrets
        - name: API_INTEGRATION_AUTH_CONFIG_NOTIFICATION_SERVICE
          valueFrom:
            secretKeyRef:
              key: API_INTEGRATION_AUTH_CONFIG_NOTIFICATION_SERVICE
              name: application-secrets
        - name: CB_API_PASS
          valueFrom:
            secretKeyRef:
              key: CB_API_PASS
              name: application-secrets
        - name: CB_API_USER
          valueFrom:
            secretKeyRef:
              key: CB_API_USER
              name: application-secrets
        - name: CKEDITOR_ENVIRONMENT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: CKEDITOR_ENVIRONMENT_SECRET_KEY
              name: application-secrets
        - name: CKEDITOR_SERVER_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              key: CKEDITOR_SERVER_LICENSE_KEY
              name: shared-secrets
        - name: CLOUD_STORAGE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: CLOUD_STORAGE_ACCESS_KEY
              name: application-secrets
        - name: CLOUD_STORAGE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: CLOUD_STORAGE_SECRET_KEY
              name: application-secrets
        - name: COOKIE_KEY
          valueFrom:
            secretKeyRef:
              key: COOKIE_KEY
              name: application-secrets
        - name: INTERNAL_API_KEY_SHARED
          valueFrom:
            secretKeyRef:
              key: INTERNAL_API_KEY_SHARED
              name: application-secrets
        - name: JWT_KEY
          valueFrom:
            secretKeyRef:
              key: JWT_KEY
              name: application-secrets
        - name: LAUNCH_DARKLY_SDK_KEY
          valueFrom:
            secretKeyRef:
              key: LAUNCH_DARKLY_SDK_KEY
              name: shared-secrets
        - name: MFA_KEY
          valueFrom:
            secretKeyRef:
              key: MFA_KEY
              name: application-secrets
        - name: NODE_OPTIONS
          value: --max-old-space-size=2800
        - name: PENDO_API_KEY
          valueFrom:
            secretKeyRef:
              key: PENDO_API_KEY
              name: shared-secrets
        - name: PG_CORE_AI_SQL_USER
          valueFrom:
            secretKeyRef:
              key: PG_CORE_AI_SQL_USER
              name: application-secrets
        - name: PG_CORE_AI_SQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CORE_AI_SQL_PASSWORD
              name: application-secrets
        - name: PG_CORE_DB
          valueFrom:
            secretKeyRef:
              key: PG_CORE_DB
              name: application-secrets
        - name: PG_CORE_RO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CORE_RO_PASSWORD
              name: application-secrets
        - name: PG_CORE_RO_USER
          valueFrom:
            secretKeyRef:
              key: PG_CORE_RO_USER
              name: application-secrets
        - name: PG_CORE_RW_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CORE_RW_PASSWORD
              name: application-secrets
        - name: PG_CORE_RW_USER
          valueFrom:
            secretKeyRef:
              key: PG_CORE_RW_USER
              name: application-secrets
        - name: PG_RUNBOOKS_DB
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_DB
              name: application-secrets
        - name: PG_RUNBOOKS_RO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_RO_PASSWORD
              name: application-secrets
        - name: PG_RUNBOOKS_RO_USER
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_RO_USER
              name: application-secrets
        - name: PG_RUNBOOKS_RW_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_RW_PASSWORD
              name: application-secrets
        - name: PG_RUNBOOKS_RW_USER
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_RW_USER
              name: application-secrets
        - name: PROVIDER_CODE_KEY
          valueFrom:
            secretKeyRef:
              key: PROVIDER_CODE_KEY
              name: application-secrets
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: application-secrets
        - name: SENTRY_DSN_BACKEND
          valueFrom:
            secretKeyRef:
              key: SENTRY_DSN_BACKEND
              name: shared-secrets
        envFrom:
        - configMapRef:
            name: env-config
        image: {{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/v2/health/full
            port: 4350
          initialDelaySeconds: 30
          timeoutSeconds: 10
        name: plextracapi
        ports:
        - containerPort: 4350
          name: plextracapi
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /api/v2/health/full
            port: 4350
          initialDelaySeconds: 30
          timeoutSeconds: 10
        resources:
          {{- toYaml .Values.resources.plextracapi | nindent 10 }}
        volumeMounts:
        - mountPath: /usr/src/plextrac-api/uploads
          name: plextracapi-vol
        - mountPath: /usr/src/plextrac-api/localesOverride/en
          name: whitelabeling-vol
      restartPolicy: Always
      terminationGracePeriodSeconds: 15
      volumes:
      - name: plextracapi-vol
        persistentVolumeClaim:
          claimName: plextracapi-pvc
      - name: whitelabeling-vol
        persistentVolumeClaim:
          claimName: whitelabeling-pvc
