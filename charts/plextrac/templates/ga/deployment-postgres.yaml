apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: plextrac
    serviceName: postgres
  name: postgres
  namespace: {{ include "plextrac.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
        prometheus.io/scrape: "true"
        k8s.grafana.com/metrics.container: postgres-exporter
        k8s.grafana.com/metrics.portName: pg-exporter
      labels:
        app: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: plextrac
        serviceName: postgres
    spec:
      {{- include "plextrac.imagePullSecrets" . | nindent 6 }}
      containers:
      - args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: application-secrets
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: application-secrets
        - name: POSTGRES_HOST_AUTH_METHOD
          value: scram-sha-256
        - name: POSTGRES_INITDB_ARGS
          value: --auth-local=scram-sha-256 --auth-host=scram-sha-256
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: PG_METRICS_USER
          valueFrom:
            secretKeyRef:
              key: PG_METRICS_USER
              name: application-secrets
        - name: PG_METRICS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_METRICS_PASSWORD
              name: application-secrets
        - name: PG_CORE_DB
          valueFrom:
            secretKeyRef:
              key: PG_CORE_DB
              name: application-secrets
        - name: PG_CORE_RO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CORE_RO_PASSWORD
              name: application-secrets
        - name: PG_CORE_RO_USER
          valueFrom:
            secretKeyRef:
              key: PG_CORE_RO_USER
              name: application-secrets
        - name: PG_CORE_RW_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CORE_RW_PASSWORD
              name: application-secrets
        - name: PG_CORE_RW_USER
          valueFrom:
            secretKeyRef:
              key: PG_CORE_RW_USER
              name: application-secrets
        - name: PG_CORE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CORE_ADMIN_PASSWORD
              name: application-secrets
        - name: PG_CORE_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: PG_CORE_ADMIN_USER
              name: application-secrets
        - name: PG_RUNBOOKS_DB
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_DB
              name: application-secrets
        - name: PG_RUNBOOKS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_ADMIN_PASSWORD
              name: application-secrets
        - name: PG_RUNBOOKS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_ADMIN_USER
              name: application-secrets
        - name: PG_RUNBOOKS_RO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_RO_PASSWORD
              name: application-secrets
        - name: PG_RUNBOOKS_RO_USER
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_RO_USER
              name: application-secrets
        - name: PG_RUNBOOKS_RW_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_RW_PASSWORD
              name: application-secrets
        - name: PG_RUNBOOKS_RW_USER
          valueFrom:
            secretKeyRef:
              key: PG_RUNBOOKS_RW_USER
              name: application-secrets
        - name: PG_CKEDITOR_DB
          valueFrom:
            secretKeyRef:
              key: PG_CKEDITOR_DB
              name: application-secrets
        - name: PG_CKEDITOR_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CKEDITOR_ADMIN_PASSWORD
              name: application-secrets
        - name: PG_CKEDITOR_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: PG_CKEDITOR_ADMIN_USER
              name: application-secrets
        - name: PG_CKEDITOR_RO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CKEDITOR_RO_PASSWORD
              name: application-secrets
        - name: PG_CKEDITOR_RO_USER
          valueFrom:
            secretKeyRef:
              key: PG_CKEDITOR_RO_USER
              name: application-secrets
        - name: PG_CKEDITOR_RW_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CKEDITOR_RW_PASSWORD
              name: application-secrets
        - name: PG_CKEDITOR_RW_USER
          valueFrom:
            secretKeyRef:
              key: PG_CKEDITOR_RW_USER
              name: application-secrets
        - name: PG_CORE_AI_SQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PG_CORE_AI_SQL_PASSWORD
              name: application-secrets
        - name: PG_CORE_AI_SQL_USER
          valueFrom:
            secretKeyRef:
              key: PG_CORE_AI_SQL_USER
              name: application-secrets
        image: {{ include "plextrac.image" (dict "image" .Values.images.postgres "root" $) }}
        name: postgres
        ports:
        - containerPort: 5432
          name: pg-port
        resources:
          {{- toYaml .Values.resources.postgres | nindent 10 }}
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
        - mountPath: /docker-entrypoint-initdb.d
          name: initdb
        - mountPath: /dev/shm
          name: dshm
      # Prometheus postgres-exporter sidecar. Connects to the local postgres as the
      # metrics user created by the postgres-initdb ConfigMap (initdb.sh). Keep PG_METRICS_*
      # in application-secrets in sync with the initdb metrics-user block, otherwise a
      # restore that re-runs initdb.sh will fail on the missing role.
      - name: postgres-exporter
        image: {{ include "plextrac.image" (dict "image" .Values.images.postgresExporter "root" $) }}
        command:
        - /bin/postgres_exporter
        args:
        - --collector.stat_statements
        env:
        - name: DATA_SOURCE_URI
          value: localhost:5432/core?sslmode=disable
        - name: DATA_SOURCE_USER
          valueFrom:
            secretKeyRef:
              key: PG_METRICS_USER
              name: application-secrets
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              key: PG_METRICS_PASSWORD
              name: application-secrets
        ports:
        - containerPort: 9187
          name: pg-exporter
        resources:
          {{- toYaml .Values.resources.postgresExporter | nindent 10 }}
      restartPolicy: Always
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - emptyDir:
          medium: Memory
          sizeLimit: 128Mi
        name: dshm
      - configMap:
          defaultMode: 484
          name: postgres-initdb
        name: initdb
