{{- if and (eq .Values.secrets.mode "externalSecrets") .Values.secrets.externalSecrets.registryCredentials.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/version: 2.23.4
  name: {{ .Values.secrets.externalSecrets.registryCredentials.targetSecretName }}-es
spec:
  data:
  - remoteRef:
      key: {{ .Values.secrets.externalSecrets.registryCredentials.remoteKey }}
    secretKey: thesecret
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
  target:
    creationPolicy: Owner
    name: {{ .Values.secrets.externalSecrets.registryCredentials.targetSecretName }}
    template:
      data:
        .dockerconfigjson: '{{ "{{ .thesecret | toString }}" }}'
      type: kubernetes.io/dockerconfigjson

{{- end }}
