{{- $cm := .Values.global.ingress.certManager | default dict -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
{{- if $cm.issuer }}
    cert-manager.io/issuer: plextrac-issuer
{{- else if .Values.global.ingress.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.global.ingress.certManagerClusterIssuer | quote }}
{{- end }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/enable-gzip: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  labels:
    app.kubernetes.io/version: 2.23.4
  name: plextracnginx-ingress
  namespace: {{ include "plextrac.namespace" . }}
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - backend:
          service:
            name: plextracnginx-svc
            port:
              number: 80
        path: /
        pathType: ImplementationSpecific
  - host: {{ include "plextrac.ingressHost" . }}
    http:
      paths:
      - backend:
          service:
            name: plextracnginx-svc
            port:
              number: 80
        path: /
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - {{ include "plextrac.ingressHost" . }}
    secretName: {{ include "plextrac.ingressTlsSecretName" . }}
