{{- if .Values.keycloak.enabled }}
{{- $cm := .Values.keycloak.certManager | default dict -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: {{ include "plextrac.namespace" . }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
  annotations:
{{- if $cm.issuer }}
    cert-manager.io/issuer: keycloak-issuer
{{- else if .Values.keycloak.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.keycloak.certManagerClusterIssuer | quote }}
{{- end }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.keycloak.host | quote }}
    http:
      paths:
      - backend:
          service:
            name: keycloak-internal
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - {{ .Values.keycloak.host | quote }}
    secretName: {{ .Values.keycloak.tlsSecretName | default "keycloak-tls" }}
{{- end }}
