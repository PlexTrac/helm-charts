{{- if and .Values.keycloak.enabled (eq .Values.secrets.mode "manual") }}
{{- if not .Values.keycloak.host }}
{{- fail "keycloak.host is required when keycloak.enabled=true (browser-facing auth hostname, e.g. auth.mycompany.com)" }}
{{- end }}
{{- $ns := include "plextrac.namespace" . }}
{{- $db := (lookup "v1" "Secret" $ns "keycloak-db-secret").data | default dict }}
{{- $ad := (lookup "v1" "Secret" $ns "keycloak-admin-secret").data | default dict }}
{{- $oidc := (lookup "v1" "Secret" $ns "keycloak-oidc-secret").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.keycloak.database.user | default "keycloak_admin" | b64enc }}
  password: {{ index $db "password" | default (randAlphaNum 24 | b64enc) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.keycloak.admin.username | default "keycloak-admin" | b64enc }}
  password: {{ index $ad "password" | default (.Values.keycloak.admin.password | default (randAlphaNum 24) | b64enc) }}
---
# Shared by the app AND your realm-provisioning migration Job: the Job configures the Keycloak
# clients to use these values; the app reads them to talk to Keycloak. Generated once, preserved.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-oidc-secret
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
type: Opaque
data:
  brokerClientSecret: {{ index $oidc "brokerClientSecret" | default (randAlphaNum 40 | b64enc) }}
  tenantRealmAdminClientSecret: {{ index $oidc "tenantRealmAdminClientSecret" | default (randAlphaNum 40 | b64enc) }}
  rsaPrivateKeyPem: {{ index $oidc "rsaPrivateKeyPem" | default (genPrivateKey "rsa" | b64enc) }}
{{- end }}
