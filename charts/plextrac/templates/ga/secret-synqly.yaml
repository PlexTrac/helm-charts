{{- if and .Values.synqly.enabled (eq .Values.secrets.mode "manual") }}
{{- $ns := include "plextrac.namespace" . }}
{{- $rt := (lookup "v1" "Secret" $ns "synqly-root-token").data | default dict }}
{{- $ad := (lookup "v1" "Secret" $ns "synqly-admin").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: synqly-root-token
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
type: Opaque
data:
  token: {{ index $rt "token" | default (randAlphaNum 32 | b64enc) }}
  signingKey: {{ index $rt "signingKey" | default (randAlphaNum 32 | b64enc) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synqly-admin
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.synqly.admin.username | default "admin" | b64enc }}
  password: {{ index $ad "password" | default (.Values.synqly.admin.password | default (randAlphaNum 24) | b64enc) }}
{{- if .Values.synqly.database.dedicated }}
{{- $db := (lookup "v1" "Secret" $ns "synqly-db").data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: synqly-db
  namespace: {{ $ns }}
  labels:
    {{- include "plextrac.commonLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ index $db "username" | default ("synqly" | b64enc) }}
  password: {{ index $db "password" | default (randAlphaNum 24 | b64enc) }}
{{- end }}
{{- end }}
