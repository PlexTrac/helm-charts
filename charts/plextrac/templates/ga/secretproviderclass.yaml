{{- if and (eq .Values.secrets.mode "csi") .Values.secrets.csi.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.csi.secretProviderClass.name }}
  namespace: {{ include "plextrac.namespace" . }}
spec:
  provider: {{ .Values.secrets.csi.secretProviderClass.provider }}
{{- with .Values.secrets.csi.secretProviderClass.parameters }}
  parameters:
{{ toYaml . | indent 4 }}
{{- end }}
{{- with .Values.secrets.csi.secretProviderClass.secretObjects }}
  secretObjects:
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
