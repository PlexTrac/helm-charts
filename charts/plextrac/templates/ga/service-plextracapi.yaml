apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/version: 2.23.4
    serviceName: core-backend
  name: plextracapi
  namespace: {{ include "plextrac.namespace" . }}
spec:
  ports:
  - name: plextracapi
    port: 4350
    targetPort: plextracapi
  selector:
    app: plextracapi
