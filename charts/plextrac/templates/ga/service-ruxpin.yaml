apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/version: 2.23.4
    serviceName: ruxpin
  name: ruxpin
  namespace: {{ include "plextrac.namespace" . }}
spec:
  ports:
  - name: ruxpin-port
    port: 5000
    targetPort: ruxpin-port
  selector:
    app: ruxpin
