apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: redis
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: redis
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: plextrac
    name: redis
    serviceName: redis
  name: redis
  namespace: {{ include "plextrac.namespace" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  serviceName: redis
  template:
    metadata:
      annotations:
        prometheus.io/metricsPortNumber: "9121"
        prometheus.io/scrape: "true"
      labels:
        app: redis
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: redis
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: plextrac
        name: redis
        serviceName: redis
    spec:
      {{- include "plextrac.imagePullSecrets" . | nindent 6 }}
      containers:
      - env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: application-secrets
        image: {{ .Values.images.redisExporter.repository }}:{{ .Values.images.redisExporter.tag }}
        name: redis-exporter
        ports:
        - containerPort: 9121
          name: redis-exporter
        resources:
          {{- toYaml .Values.resources.redisExporter | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 59000
          runAsUser: 59000
      - args:
        - --requirepass
        - $(REDIS_PASSWORD)
        - --maxmemory
        - 2gb
        - --loglevel
        - warning
        command:
        - redis-server
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: application-secrets
        image: {{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}
        name: redis
        ports:
        - containerPort: 6379
          name: redis-port
        resources:
          {{- toYaml .Values.resources.redis | nindent 10 }}
        volumeMounts:
        - mountPath: /data
          name: redis-data
      restartPolicy: Always
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
