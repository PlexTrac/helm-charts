global:
  namespace: plextrac
  createNamespace: true
  imagePullSecrets: []   # e.g. [{name: ckeditor-registry-creds}]
  image:
    # Optional registry prefix applied to every component image EXCEPT those that set
    # their own images.<component>.registry (e.g. ckeditor). Leave "" to use each
    # repository as-is; set it to your registry/mirror to re-home all images at once,
    # e.g. registry: registry.mycompany.com
    registry: ""
  ingress:
    host: ""
    tlsSecretName: plextrac-com-tls
    # cert-manager integration — choose how the TLS certificate is issued.
    certManager:
      # ""                    = none / bring-your-own (use certManagerClusterIssuer below)
      # "selfSigned"          = local/dev: cert-manager mints a self-signed cert (browser warnings)
      # "letsencrypt"         = public prod: ACME HTTP-01 via Let's Encrypt (needs public DNS + :80 open)
      # "letsencrypt-staging" = like letsencrypt but against LE staging (untrusted, rate-limit-safe for testing)
      issuer: ""
      email: ""   # required when issuer is "letsencrypt" or "letsencrypt-staging"
    # Used only when certManager.issuer is "" — name of an Issuer/ClusterIssuer you created yourself.
    certManagerClusterIssuer: ""

storage:
  storageClassName: local-path   # K3s default. For GKE use "standard" or "premium-rwo"; AKS use "default" or "managed-premium"; EKS use "gp2" or "gp3"

secrets:
  mode: manual
  externalSecrets:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: ""
    application:
      targetSecretName: application-secrets
      remoteKey: ""
    shared:
      targetSecretName: shared-secrets
      remoteKey: ""
    registryCredentials:
      enabled: false
      targetSecretName: regcred-dorf
      remoteKey: ""
    tls:
      enabled: false
      targetSecretName: plextrac-com-tls
      remoteKey: ""
  csi:
    secretProviderClass:
      enabled: false
      name: plextrac-secrets-provider
      provider: ""
      parameters: {}
      secretObjects: []
  manual:
    createKubernetesSecrets: true
    requiredKeys:
      application:
        - ADMIN_EMAIL
        - API_INTEGRATION_AUTH_CONFIG_NOTIFICATION_SERVICE
        - CB_ADMIN_PASS
        - CB_ADMIN_USER
        - CB_API_PASS
        - CB_API_USER
        - CB_BACKUP_PASS
        - CB_BACKUP_USER
        - CB_BUCKET
        - CKEDITOR_ENVIRONMENT_SECRET_KEY
        - CLOUD_STORAGE_ACCESS_KEY
        - CLOUD_STORAGE_SECRET_KEY
        - COOKIE_KEY
        - INTERNAL_API_KEY_SHARED
        - JWT_KEY
        - MFA_KEY
        - MINIO_LOCAL_PASSWORD
        - MINIO_LOCAL_USER
        - MINIO_ROOT_PASSWORD
        - MINIO_ROOT_USER
        - PG_CKEDITOR_ADMIN_PASSWORD
        - PG_CKEDITOR_ADMIN_USER
        - PG_CKEDITOR_DB
        - PG_CKEDITOR_RO_PASSWORD
        - PG_CKEDITOR_RO_USER
        - PG_CKEDITOR_RW_PASSWORD
        - PG_CKEDITOR_RW_USER
        - PG_CORE_ADMIN_PASSWORD
        - PG_CORE_ADMIN_USER
        - PG_CORE_AI_SQL_PASSWORD
        - PG_CORE_AI_SQL_USER
        - PG_CORE_DB
        - PG_CORE_RO_PASSWORD
        - PG_CORE_RO_USER
        - PG_CORE_RW_PASSWORD
        - PG_CORE_RW_USER
        - PG_RUNBOOKS_ADMIN_PASSWORD
        - PG_RUNBOOKS_ADMIN_USER
        - PG_RUNBOOKS_DB
        - PG_RUNBOOKS_RO_PASSWORD
        - PG_RUNBOOKS_RO_USER
        - PG_RUNBOOKS_RW_PASSWORD
        - PG_RUNBOOKS_RW_USER
        - POSTGRES_PASSWORD
        - POSTGRES_USER
        - PROVIDER_CODE_KEY
        - REDIS_PASSWORD
      shared:
        - CKEDITOR_SERVER_LICENSE_KEY
        - LAUNCH_DARKLY_SDK_KEY
        - PENDO_API_KEY
        - SENTRY_DSN_BACKEND
    generatedSecrets:
      application:
        name: application-secrets
        stringData:
          # Docker-compose static defaults (overridable)
          CB_ADMIN_USER: ptadminuser
          CB_API_USER: ptapiuser
          CB_BACKUP_USER: ptbackupuser
          CB_BUCKET: reportMe
          POSTGRES_USER: internalonly
          PG_CORE_DB: core
          PG_CORE_ADMIN_USER: core_admin
          PG_CORE_RO_USER: core_ro
          PG_CORE_RW_USER: core_rw
          PG_CORE_AI_SQL_USER: ai_sql
          PG_RUNBOOKS_DB: runbooks
          PG_RUNBOOKS_ADMIN_USER: runbooks_admin
          PG_RUNBOOKS_RO_USER: runbooks_ro
          PG_RUNBOOKS_RW_USER: runbooks_rw
          PG_CKEDITOR_DB: ckeditor
          PG_CKEDITOR_ADMIN_USER: ckeditor_admin
          PG_CKEDITOR_RO_USER: ckeditor_ro
          PG_CKEDITOR_RW_USER: ckeditor_rw
          MINIO_ROOT_USER: admin
          MINIO_LOCAL_USER: localadmin
          ADMIN_EMAIL: ""   # Optional: admin notification email
        data: {}
      shared:
        name: shared-secrets
        stringData:
          CKEDITOR_SERVER_LICENSE_KEY: ""   # Customer must provide
          LAUNCH_DARKLY_SDK_KEY: ""
          PENDO_API_KEY: ""
          SENTRY_DSN_BACKEND: ""
        data: {}
      registryCredentials:
        enabled: false   # Set to true and provide dockerconfigjson to pull PlexTrac images
        name: regcred-dorf
        dockerconfigjson: ""
      tls:
        enabled: false
        name: plextrac-com-tls
        crt: ""
        key: ""
      additional: []

# Each component's image renders as "<registry>/<repository>:<tag>", where <registry>
# is images.<component>.registry if set, else global.image.registry, else omitted.
# Components below without a `registry:` inherit global.image.registry.
images:
  backend:
    repository: plextrac/plextracapi
    tag: stable
  nginx:
    repository: plextrac/plextracnginx
    tag: stable
  ckeditor:
    # Pinned to CKEditor's own registry — NOT affected by global.image.registry.
    registry: docker.cke-cs.com
    repository: cs
    tag: latest
  plextracdb:
    repository: plextrac/plextracdb
    tag: 6.5.1
  postgres:
    repository: plextrac/plextracpostgres
    tag: stable
  redis:
    repository: redis
    tag: 8.4.0-alpine
  redisExporter:
    repository: oliver006/redis_exporter
    tag: latest
  minio:
    repository: plextrac/minio
    tag: latest
  minioBootstrap:
    repository: plextrac/plextrac-minio-bootstrap
    tag: stable
  synqly:
    # On quay.io by default — set registry to your quay proxy/mirror to override.
    registry: quay.io
    repository: synqly/embedded
    tag: embedded-2026.06.19

replicaCounts:
  plextracapi: 3
  ckeditor: 3
  eventOrchestrator: 1
  notificationEngine: 1
  notificationSender: 1
  integrationWorker: 1
  contextualScoringService: 1
  datalakeMaintainer: 0   # Disabled by default for self-hosted

resources:
  plextracapi:
    limits:
      cpu: 1150m
      memory: 4Gi
    requests:
      cpu: 20m
      memory: 250Mi
  nginx:
    limits:
      cpu: 100m
      memory: 150Mi
    requests:
      cpu: 3m
      memory: 10Mi
  postgres:
    limits:
      cpu: "2"
      memory: 6656Mi
    requests:
      cpu: 10m
      memory: 256Mi
  ckeditor:
    limits:
      memory: 2048Mi
    requests:
      cpu: 100m
      memory: 300Mi
  contextualScoringService:
    limits:
      cpu: 800m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 100Mi
  datalakeMaintainer:
    limits:
      cpu: 250m
      memory: 4Gi
    requests:
      cpu: 150m
      memory: 128Mi
  eventOrchestrator:
    limits:
      cpu: 1150m
      memory: 2Gi
    requests:
      cpu: 50m
      memory: 256Mi
  integrationWorker:
    limits:
      cpu: 1150m
      memory: 4Gi
    requests:
      cpu: 20m
      memory: 250Mi
  notificationEngine:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  notificationSender:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  plextracdb:
    limits:
      cpu: 2000m
      memory: 6.5Gi
    requests:
      cpu: 100m
      memory: 1250Mi
  redis:
    limits:
      cpu: 800m
      memory: 2Gi
    requests:
      cpu: 30m
      memory: 256Mi
  redisExporter:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Synqly Embedded — optional, in-cluster integration service (internal only, no ingress).
# Keys are stored in the database (AEAD); intended for non-production. See docs.
synqly:
  enabled: false
  organizationID: plextrac          # slug only: [a-z0-9_-.], no spaces or "@"
  organizationFullName: PlexTrac
  imagePullSecrets:
    - name: plextrac-registry-creds
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  admin:
    username: ""                    # REQUIRED when enabled: must be an email address (Synqly org admin)
    password: ""                    # generated if empty
  database:
    dedicated: false                # false = reuse bundled Postgres (auto-creates the DB); true = chart deploys a dedicated Postgres
    name: synqly
    host: ""                        # defaults to "postgres" (bundled) or "synqly-postgres" (dedicated)
    port: 5432
    storage: 8Gi                    # dedicated Postgres PVC size
