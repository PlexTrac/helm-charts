# Synqly Embedded — optional, in-cluster integration service (internal only, no ingress).
# Keys are stored in the database (AEAD); intended for non-production. See docs.
synqly:
  enabled: false
  organizationID: plextrac          # slug only: [a-z0-9_-.], no spaces or "@"
  organizationFullName: PlexTrac
  imagePullSecrets:
    - name: internal-registry-creds
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  admin:
    username: ""                    # REQUIRED when enabled: must be an email address (Synqly org admin)
    password: ""                    # generated if empty
  database:
    dedicated: false                # false = reuse bundled Postgres (auto-creates the DB); true = chart deploys a dedicated Postgres
    name: synqly
    host: ""                        # defaults to "postgres" (bundled) or "synqly-postgres" (dedicated)
    port: 5432
    storage: 8Gi                    # dedicated Postgres PVC size

# Keycloak — optional, in-cluster OIDC/SSO identity broker (browser-facing via ingress).
# Realm/OIDC-client provisioning is done by a separate migration Job you run; the chart
# generates keycloak-oidc-secret (broker client secret, tenant-realm-admin secret, RSA key)
# for that Job and the app to share. Disabled by default. Independent of synqly.
keycloak:
  enabled: false
  host: ""                          # REQUIRED when enabled: browser-facing auth hostname (e.g. auth.mycompany.com)
  replicas: 1
  admin:
    username: admin@mycompany.com   # Keycloak bootstrap admin
    password: ""                    # generated if empty
  tlsSecretName: keycloak-tls
  # TLS for the keycloak ingress. Three ways to provide the keycloak-tls secret:
  #   cert-manager   -> set certManager.issuer (selfSigned | letsencrypt | letsencrypt-staging) [+ email]
  #   bring-your-own -> leave certManager.issuer "" and set certManagerClusterIssuer to your Issuer/ClusterIssuer
  #   pre-created    -> leave both empty and create the keycloak-tls secret yourself
  certManager:
    issuer: ""
    email: ""                       # required for letsencrypt / letsencrypt-staging
  certManagerClusterIssuer: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # Pulls use global.imagePullSecrets. To add keycloak-only secrets, set keycloak.imagePullSecrets
  # (merged with the global list, deduped).
  database:
    dedicated: false                # false = create a keycloak DB + user in the bundled Postgres; true = dedicated Postgres
    name: keycloak
    user: keycloak_admin
    host: ""                        # defaults to "postgres" (bundled) or "keycloak-postgres" (dedicated)
    port: 5432
    storage: 8Gi

# Optional in-cluster MCP (Model Context Protocol) server, disabled by default.
# REQUIRES keycloak.enabled (it authenticates via Keycloak). Served as a path (/mcp) on the
# main app host, not a separate hostname. See docs/user-guide.md.
mcp:
  enabled: false
  replicas: 1
  # Block /mcp/metrics at the ingress. Emits an nginx configuration-snippet annotation, which
  # REQUIRES the ingress-nginx controller to allow snippet annotations (allow-snippet-annotations:
  # true) — otherwise the admission webhook rejects the Ingress. Off by default because current
  # ingress-nginx disables snippets. MCP metrics are scraped in-cluster on port 8000 regardless.
  blockMetricsPath: false
  # OpenTelemetry is off by default (on-prem has no collector). To enable, set otel.enabled=true
  # and point otel.exporterEndpoint at your OTLP gRPC receiver.
  otel:
    enabled: false
    exporterEndpoint: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Pulls use global.imagePullSecrets. To add mcp-only secrets, set mcp.imagePullSecrets
  # (merged with the global list, deduped).
